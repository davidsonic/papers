name: Daily Paper Fetch

on:
  schedule:
    # Run 4x daily (UTC). HuggingFace publishes the next day's papers around
    # 20:00 UTC, so the late-evening run catches them the same day.
    - cron: '57 6 * * *'    # morning
    - cron: '3 13 * * *'    # noon
    - cron: '57 16 * * *'   # afternoon
    - cron: '23 20 * * *'   # night (after HF's daily update)
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch new papers
        run: |
          python3 scripts/fetch_papers.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        uses: EndBug/add-and-commit@v10
        with:
          add: 'data/papers_all.json'
          message: 'Fetch new papers from HuggingFace'
          default_author: github_actions
          push: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

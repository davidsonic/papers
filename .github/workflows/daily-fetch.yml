name: Daily Paper Fetch & Summarize

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch new papers
        run: |
          python3 scripts/fetch_papers.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize and tag papers
        run: |
          # Get the paper IDs from papers_all.json that aren't yet summarized
          python3 << 'EOF'
          import json
          from pathlib import Path

          data_dir = Path("data")
          all_papers_file = data_dir / "papers_all.json"
          prototype_file = data_dir / "papers_prototype.json"

          # Load all papers
          with open(all_papers_file) as f:
              all_papers = json.load(f)

          # Load prototype (if exists)
          prototype = {}
          if prototype_file.exists():
              with open(prototype_file) as f:
                  prototype_list = json.load(f)
                  prototype = {p["id"]: p for p in prototype_list}

          # Find unsummarized papers (up to 10 new ones per day)
          unsummarized = [p["id"] for p in all_papers if p["id"] not in prototype][:10]

          if unsummarized:
              print(" ".join(unsummarized))
          EOF
        id: get-unsummarized

      - name: Run Claude summarization
        if: steps.get-unsummarized.outputs.result != ''
        run: |
          python3 scripts/summarize_papers.py ${{ steps.get-unsummarized.outputs.result }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit changes
        if: always()
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/papers_prototype.json data/tags.json data/raw/*.json'
          message: 'Daily: fetch new papers and summarize with Claude'
          default_author: github_actions
          push: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: papers.yourdomain.com  # Change this to your domain, or remove for default gh-pages URL

name: Build Evolution Dataset

on:
  workflow_dispatch:  # Manual trigger with a keyword
    inputs:
      keyword:
        description: 'Research keyword to analyze, e.g. "world model"'
        required: true
        type: string

jobs:
  build-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build evolution dataset for keyword
        run: |
          python3 scripts/build_evolution.py "${{ inputs.keyword }}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit changes
        uses: EndBug/add-and-commit@v10
        with:
          add: 'data/evolution'
          message: 'Evolution dataset for "${{ inputs.keyword }}"'
          default_author: github_actions
          push: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

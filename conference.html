<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Explorer</title>
<style>
:root {
  --bg: #ffffff;
  --bg-alt: #f6f8fa;
  --border: #d0d7de;
  --text: #1f2328;
  --text-dim: #57606a;
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --oral: #b35900;
  --oral-bg: #fff3e0;
  --spot: #7a3ea8;
  --spot-bg: #f3e8fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --bg-alt: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-soft: #1c2a3a;
    --oral: #f0a35c;
    --oral-bg: #3a2a15;
    --spot: #c99ce8;
    --spot-bg: #2e1f3d;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --bg-alt: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent-soft: #1c2a3a;
  --oral: #f0a35c;
  --oral-bg: #3a2a15;
  --spot: #c99ce8;
  --spot-bg: #2e1f3d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 16px; }
.sub a { color: var(--accent); text-decoration: none; }

.searchbar { display: flex; gap: 8px; margin: 12px 0 8px; flex-wrap: wrap; }
.searchbar input[type="text"] {
  flex: 1; min-width: 200px;
  padding: 10px 14px; font-size: 1rem;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
}
.searchbar button {
  padding: 10px 20px; font-size: 1rem; border-radius: 8px;
  border: 1px solid var(--border); background: var(--accent); color: #fff;
  cursor: pointer;
}
.suggestions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.suggestions button {
  font-size: 0.8rem; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg-alt); color: var(--text-dim);
  cursor: pointer;
}
.suggestions button:hover { border-color: var(--accent); color: var(--accent); }

.meta { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 16px; }

.badge {
  display: inline-block; font-size: 0.7rem; padding: 1px 8px; border-radius: 999px;
  vertical-align: middle;
}
.badge.oral { background: var(--oral-bg); color: var(--oral); font-weight: 600; }
.badge.spotlight { background: var(--spot-bg); color: var(--spot); }
.badge.venue { background: var(--accent-soft); color: var(--accent); }

.cat {
  border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 20px; overflow: hidden; background: var(--bg);
}
.cat-head {
  padding: 10px 16px; background: var(--bg-alt);
  display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline;
  border-bottom: 1px solid var(--border);
}
.cat-head h2 { margin: 0; font-size: 1.05rem; }
.cat-count { color: var(--text-dim); font-size: 0.8rem; }
.cat-desc { color: var(--text-dim); font-size: 0.87rem; padding: 10px 16px 0; }
.cat-papers { padding: 10px 16px 14px; }
.pap { padding: 8px 0; border-bottom: 1px solid var(--border); }
.pap:last-child { border-bottom: none; }
.pap a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
.pap .pap-meta { color: var(--text-dim); font-size: 0.78rem; margin: 2px 0; }
.pap .pap-added { font-size: 0.87rem; }

.loading, .empty { color: var(--text-dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Conference Explorer</h1>
  <div class="sub">Accepted papers from NeurIPS, ICLR, ICML and CVPR 2026 (gisbi-kim conference explorers), grouped by research aspect.
    <a href="index.html">← Paper explorer</a> · <a href="evolution.html">HuggingFace daily explorer</a></div>

  <div class="searchbar">
    <input type="text" id="kw" placeholder='Enter a research keyword, e.g. "world model"' autocomplete="off">
    <button id="go">Explore</button>
  </div>
  <div class="suggestions" id="suggestions"></div>

  <div id="content"><div class="empty">Type a keyword to group accepted conference papers by research aspect. Precomputed topics appear as suggestions.</div></div>
</div>

<script>
const SLUG = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const SOURCE = "conferences.json";
let DATA = null;

const OR_URL = "https://openrouter.ai/api/v1/chat/completions";
const OR_MODEL = "z-ai/glm-5.3-flash";
const MAX_PAPERS = 5000, BATCH_SIZE = 20, ABSTRACT_CHARS = 700;
const CACHE_PREFIX = "conf:";
const OR_TIMEOUT_MS = 180000;

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

function getKey() {
  try { return localStorage.getItem("openrouter_key") || ""; } catch { return ""; }
}

function askKey(content) {
  content.innerHTML = `<div class="empty">Computing “${esc(lastKw)}” online needs an OpenRouter API key
    (used only from your browser, stored in localStorage).<br><br>
    <input type="password" id="orkey" placeholder="sk-or-..." style="padding:8px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);color:var(--text);width:min(420px,90%)">
    <br><br><button id="orsave" style="padding:8px 20px;border-radius:8px;border:1px solid var(--border);
    background:var(--accent);color:#fff;cursor:pointer">Save and compute</button></div>`;
  document.getElementById("orsave").onclick = () => {
    const k = document.getElementById("orkey").value.trim();
    if (!k) return;
    try { localStorage.setItem("openrouter_key", k); } catch {}
    explore(lastKw);
  };
}

async function orCall(prompt, maxTokens) {
  const body = {
    model: OR_MODEL,
    max_tokens: maxTokens + 4096, // headroom for thinking
    temperature: 0.3,
    reasoning: { effort: "low" },
    messages: [{ role: "user", content: prompt }],
  };
  let lastErr = null;
  for (let attempt = 0; attempt < 4; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), OR_TIMEOUT_MS);
    try {
      const r = await fetch(OR_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${getKey()}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });
      if (!r.ok) {
        const detail = await r.text().catch(() => "");
        throw new Error(`HTTP ${r.status}${detail ? ": " + detail.slice(0, 200) : ""}`);
      }
      const data = await r.json();
      const choice = data.choices && data.choices[0];
      const msg = choice && choice.message;
      if (choice && choice.finish_reason === "length" && (!msg || !msg.content))
        throw new Error("model ran out of tokens while thinking");
      if (!msg || !msg.content) throw new Error("empty response from model");
      return msg.content;
    } catch (e) {
      lastErr = e.name === "AbortError" ? new Error(`timed out after ${OR_TIMEOUT_MS / 1000}s`) : e;
      if (attempt === 3) throw lastErr;
      orNote(`attempt ${attempt + 1} failed (${lastErr.message}), retrying…`);
      await new Promise(res => setTimeout(res, 3000 * (attempt + 1)));
    } finally {
      clearTimeout(timer);
    }
  }
  throw lastErr;
}

let orNoteText = "";
function orNote(msg) {
  orNoteText = msg;
  setTimeout(() => { if (orNoteText === msg) orNoteText = ""; }, 8000);
}

function asArray(out) {
  if (Array.isArray(out)) return out;
  if (out && typeof out === "object") {
    for (const key of ["papers", "results", "items", "entries", "list", "data"]) {
      if (Array.isArray(out[key])) return out[key];
    }
  }
  return null;
}

function firstJson(text) {
  if (!text) return null;
  text = text.trim().replace(/^```[a-z]*\n?/, "").replace(/\n?```$/, "");
  for (const [a, b] of [["{", "}"], ["[", "]"]]) {
    const s = text.indexOf(a);
    if (s === -1) continue;
    let depth = 0;
    for (let i = s; i < text.length; i++) {
      if (text[i] === a) depth++;
      else if (text[i] === b && --depth === 0) {
        try { return JSON.parse(text.slice(s, i + 1)); } catch { break; }
      }
    }
  }
  return null;
}

let statusMsg = "", statusAt = 0, statusTimer = null;

function status(content, msg) {
  statusMsg = msg;
  statusAt = Date.now();
  const el = document.getElementById("evo-status");
  const paint = () => {
    const secs = Math.floor((Date.now() - statusAt) / 1000);
    const line = orNoteText ? `${orNoteText} — ${statusMsg}` : statusMsg;
    const text = `${line} · ${secs}s`;
    if (el) el.textContent = text;
    else content.innerHTML = `<div class="loading" id="evo-status">${esc(text)}</div>`;
  };
  paint();
  clearInterval(statusTimer);
  statusTimer = setInterval(paint, 1000);
}

function statusDone() {
  clearInterval(statusTimer);
  statusTimer = null;
}

let lastKw = "";

/* paper link: venue url when known, else the conference explorer */
function paperHref(p) {
  return p.url || "https://gisbi-kim.github.io/conference-explorers/";
}

async function loadManifest() {
  const box = document.getElementById("suggestions");
  box.innerHTML = "";
  let m = [];
  try {
    const r = await fetch("data/evolution/manifest.json");
    m = (await r.json()).filter(e => e.source === SOURCE);
    m.forEach(e => {
      const b = document.createElement("button");
      b.textContent = `${e.keyword} (${e.paperCount} papers)`;
      b.onclick = () => explore(e.keyword);
      box.appendChild(b);
    });
  } catch {}
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k.startsWith(CACHE_PREFIX)) continue;
      const slug = k.slice(CACHE_PREFIX.length);
      if (m.some(e => e.slug === slug)) continue;
      let d;
      try { d = JSON.parse(localStorage.getItem(k)); } catch { continue; }
      const b = document.createElement("button");
      b.textContent = `${d.keyword} (${d.paperCount} papers, cached)`;
      b.onclick = () => explore(d.keyword);
      box.appendChild(b);
    }
  } catch {}
  return m;
}

async function explore(keyword) {
  keyword = (keyword || "").trim();
  if (!keyword) return;
  const slug = SLUG(SOURCE.replace(".json", "") + "-" + keyword);
  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">Loading…</div>';
  let data;
  try {
    const r = await fetch(`data/evolution/${slug}.json`);
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch {
    try {
      data = await computeOnline(keyword, slug);
    } catch (e) {
      statusDone();
      content.innerHTML = `<div class="empty">Computing “${esc(keyword)}” failed: ${esc(String(e.message || e))}<br><br>
        Check your OpenRouter key and connection, then try again.</div>`;
      return;
    }
    if (!data) { statusDone(); return; }
  }
  DATA = data;
  document.getElementById("kw").value = keyword;
  render();
}

/* ---------- Online compute over conferences.json ---------- */
async function computeOnline(keyword, slug) {
  lastKw = keyword;
  const content = document.getElementById("content");
  try {
    const cached = localStorage.getItem(CACHE_PREFIX + slug);
    if (cached) {
      status(content, "Using cached online result.");
      statusDone();
      return JSON.parse(cached);
    }
  } catch {}

  if (!getKey()) { askKey(content); return null; }
  content.innerHTML = '<div class="loading" id="evo-status">Loading conference index…</div>';

  if (!window.__conf) {
    const r = await fetch("data/conferences.json");
    const parsed = await r.json();
    window.__conf = parsed.papers || parsed;
  }
  const papers = window.__conf;
  const kw = keyword.toLowerCase();
  const scored = [];
  for (const p of papers) {
    const title = (p.title || "").toLowerCase();
    const abstract = (p.abstract || "").toLowerCase();
    const th = title.split(kw).length - 1;
    const ab = abstract.split(kw).length - 1;
    if (!th && !ab) continue;
    const boost = { oral: 60, spotlight: 30, highlight: 20 }[p.status] || 0;
    scored.push([th * 8 + Math.min(ab, 4) + boost, p]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  if (scored.length > MAX_PAPERS)
    orNote(`${scored.length} matches, using top ${MAX_PAPERS} to bound cost`);
  const selected = scored.slice(0, MAX_PAPERS).map(x => x[1]);
  if (!selected.length) {
    content.innerHTML = `<div class="empty">No accepted papers match “${esc(keyword)}”.</div>`;
    return null;
  }
  const compact = selected.map((p, i) => ({
    id: p.id || `c${i}`,
    title: p.title,
    org: (p.orgs && p.orgs[0]) || "Independent",
    upvotes: { oral: 60, spotlight: 30, highlight: 20 }[p.status] || 0,
    venue: p.venue, status: p.status, url: p.url || "",
    abstract: (p.abstract || "").slice(0, ABSTRACT_CHARS),
  }));
  const byId = {};
  for (const p of compact) byId[p.id] = p;

  const oneLiners = {};
  const batches = [];
  for (let i = 0; i < compact.length; i += BATCH_SIZE) batches.push(compact.slice(i, i + BATCH_SIZE));
  for (let bi = 0; bi < batches.length; bi++) {
    status(content, `Writing per-paper contributions (batch ${bi + 1}/${batches.length})…`);
    const listing = JSON.stringify(batches[bi].map(p => ({ id: p.id, title: p.title, abstract: p.abstract })));
    const out = firstJson(await orCall(
      "Below are accepted conference papers with abstracts, from NeurIPS/ICLR/ICML/CVPR 2026. " +
      "For EACH paper write ONE sentence (max 25 words) describing what NEW capability, " +
      "technique, or problem shift it introduces. Be concrete and technical, not generic. Do not praise.\n\n" +
      "Papers:\n" + listing + "\n\n" +
      'Return ONLY a JSON array: [{"id": "<id>", "added": "<sentence>"}, ...] ' +
      "with exactly one entry per input paper, same ids.", 4096));
    const items = asArray(out);
    if (items) for (const it of items) if (it && it.id && it.added) oneLiners[it.id] = it.added;
  }
  for (const p of compact) if (!oneLiners[p.id]) oneLiners[p.id] = "";

  status(content, "Grouping papers into research categories…");
  const tListing = JSON.stringify(compact.map(p => ({ id: p.id, title: p.title, added: oneLiners[p.id] })));
  let cats = [];
  const tout = firstJson(await orCall(
    "Below are accepted conference papers on one research area, each with a one-line 'added' note. " +
    "Group them into distinct CATEGORIES — a category is a set of papers tackling the same core problem " +
    "or aspect of the research area. Rules:\n" +
    "- 6 to 14 categories total. Every paper goes in exactly one category.\n" +
    "- Categories should be distinguishable by the problem they attack, not by venue or team.\n" +
    "- For each category also write a 1-2 sentence description of what this aspect of the field is about.\n\n" +
    "Papers:\n" + tListing + "\n\n" +
    'Return ONLY JSON: {"categories": [{"name": "<short category name, 3-6 words>", "description": "<1-2 sentences>", "ids": ["<id>", ...]}, ...]}', 8192));
  if (tout && tout.categories) {
    cats = tout.categories.filter(t => t && t.ids && t.ids.length)
      .map(t => ({ name: t.name || "?", description: t.description || "", ids: t.ids }));
    const known = new Set(cats.flatMap(t => t.ids));
    const leftovers = compact.filter(p => !known.has(p.id)).map(p => p.id);
    if (leftovers.length) cats.push({ name: "Other", description: "", ids: leftovers });
  } else {
    cats = [{ name: "All papers", description: "", ids: compact.map(p => p.id) }];
  }

  const result = {
    keyword, builtAt: new Date().toISOString().slice(0, 10), paperCount: compact.length,
    categories: cats.map(t => {
      const ps = t.ids.map(i => byId[i]).filter(Boolean);
      ps.sort((a, b) => (b.upvotes - a.upvotes) || a.title.localeCompare(b.title));
      return { name: t.name, description: t.description || "", count: ps.length, papers: ps };
    }).sort((a, b) => b.count - a.count),
    online: true,
  };

  try { localStorage.setItem(CACHE_PREFIX + slug, JSON.stringify(result)); } catch {}
  statusDone();
  return result;
}

/* ---------- Single view: categories ---------- */
function badges(p) {
  let s = "";
  if (p.venue) s += `<span class="badge venue">${esc(p.venue)}</span>`;
  if (p.status === "oral") s += `<span class="badge oral">Oral</span>`;
  else if (p.status === "spotlight") s += `<span class="badge spotlight">Spotlight</span>`;
  return s;
}

function render() {
  const c = document.getElementById("content");
  let html = `<div class="meta">${DATA.paperCount} papers · ${DATA.categories ? DATA.categories.length : 0} categories · built ${DATA.builtAt} · source: NeurIPS/ICLR/ICML/CVPR 2026</div>`;
  const cats = DATA.categories || [];
  if (!cats.length) { html += '<div class="empty">No category data.</div>'; c.innerHTML = html; return; }
  for (const cat of cats) {
    html += `<div class="cat">
      <div class="cat-head"><h2>${esc(cat.name)}</h2>
        <span class="cat-count">${cat.count} papers</span></div>
      ${cat.description ? `<div class="cat-desc">${esc(cat.description)}</div>` : ""}
      <div class="cat-papers">`;
    for (const p of cat.papers) {
      html += `<div class="pap">
        <a href="${esc(paperHref(p))}" target="_blank" rel="noopener">${esc(p.title)}</a>
        ${badges(p)}
        <div class="pap-meta">${esc(p.venue || "")} · ${esc(p.org || "")}</div>
        ${p.added ? `<div class="pap-added">${esc(p.added)}</div>` : ""}
      </div>`;
    }
    html += "</div></div>";
  }
  c.innerHTML = html;
}

document.getElementById("go").onclick = () => explore(document.getElementById("kw").value);
document.getElementById("kw").addEventListener("keydown", e => {
  if (e.key === "Enter") explore(document.getElementById("kw").value);
});

const params = new URLSearchParams(location.search);
loadManifest().then(m => {
  const kw = params.get("kw");
  if (kw) explore(kw);
  else if (m.length) explore(m[0].keyword);
});
</script>
</body>
</html>
